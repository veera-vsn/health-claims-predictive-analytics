<!DOCTYPE html>
<html>
<head>
    <title>Vhi Risk Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; }
        .container { background: white; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 50px; }
        input { margin: 10px; padding: 10px; width: 200px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Vhi Member Cost Predictor</h2>
        <form action="/predict" method="post">
            <input type="text" name="age" placeholder="Age" required="required" /><br>
            <input type="text" name="bmi" placeholder="BMI (e.g. 28.5)" required="required" /><br>
            <input type="text" name="children" placeholder="Number of Children" required="required" /><br>
            <input type="text" name="smoker" placeholder="Smoker? (1 for Yes, 0 for No)" required="required" /><br>
            <button type="submit">Predict Cost</button>
        </form>
        <br>
        <h3>{{ prediction_text }}</h3>
    </div>
</body>
</html>
